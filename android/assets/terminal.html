<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="xterm/xterm.css">
<style>html,body,#terminal{margin:0;width:100%;height:100%;background:#000;overflow:hidden}.xterm-cursor-layer{visibility:hidden}</style>
</head><body><div id="terminal"></div>
<script src="xterm/xterm.js"></script><script src="xterm/addon-fit.js"></script>
<script>
// 26 CSS px at 1920 wide gives about 120 columns; proportional sizing
// also accommodates Android TV's density-scaled CSS viewport.
const term = new Terminal({fontFamily:'monospace', fontSize:Math.max(12, innerWidth / 74),
  lineHeight:1.2, theme:{background:'#000000'}, allowProposedApi:true});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('terminal'));
term.onResize(({cols, rows}) => Android.resize(cols, rows));
// Device keys are consumed in Java; onData also carries terminal query replies.
term.onData(data => Android.input(data));
window.nu11Write = base64 => {
  const bytes = atob(base64);
  const data = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; ++i) data[i] = bytes.charCodeAt(i);
  term.write(data);
};
function resize() { fit.fit(); Android.resize(term.cols, term.rows); }
window.addEventListener('resize', resize);
resize();
Android.ready();
</script></body></html>
